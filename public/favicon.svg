<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra sutil estilo Material Design / Google App Logo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="inner-sand-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo limpio circular o redondeado estilo icono de app -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- Contenedor principal con sombra de app de Google -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    
    <!-- Cuerpo de cristal transparente con borde grueso redondeado -->
    <path d="M -90 -130 
             C -90 -130, -90 -50, -10 0 
             C -10 0, -90 50, -90 130 
             L 90 130 
             C 90 130, 90 50, 10 0 
             C 10 0, 90 -50, 90 -130 
             Z" 
          fill="#f8fafc" 
          stroke="#334155" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Tapa superior e inferior del reloj -->
    <path d="M -110 -130 L 110 -130" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <path d="M -110 130 L 110 130" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>

    <!-- Arena concentrada únicamente arriba (Color ámbar oscuro/profundo) -->
    <g filter="url(#inner-sand-shadow)">
      <path d="M -78 -118 
               C -82 -80, -45 -15, 0 0 
               C 45 -15, 82 -80, 78 -118 
               Z" 
            fill="#d97706" />
    </g>

    <!-- Brillo superior de la arena -->
    <ellipse cx="0" cy="-108" rx="72" ry="14" fill="#fbbf24" opacity="0.85" />

    <!-- Hilo fino de arena cayendo -->
    <line x1="0" y1="0" x2="0" y2="28" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,6" />

    <!-- Pequeño montículo inicial abajo -->
    <ellipse cx="0" cy="115" rx="16" ry="6" fill="#d97706" opacity="0.9" />

    <!-- Reflejo de cristal translúcido moderno -->
    <path d="M -65 -100 C -65 -60, -35 -20, -10 0" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
